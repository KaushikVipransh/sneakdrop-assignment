services:
  postgres:
    image: postgres:17-alpine
    container_name: sneakdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sneakdrop
      POSTGRES_PASSWORD: sneakdrop
      POSTGRES_DB: sneakdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneakdrop -d sneakdrop"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
